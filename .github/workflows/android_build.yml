name: Build & Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Grant Execute Permission for Gradle
        run: chmod +x ./gradlew || true

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EastWestGlobal-App-Debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release & Attach APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-build-${{ github.run_number }}
          name: "East & West Global App v1.0.0 (Build ${{ github.run_number }})"
          body: |
            ### 🏢 تطبيق شركة الشرق والغرب العالمية والشركات التابعة
            **East & West Global Group & Subsidiaries Enterprise Application**
            
            - 👑 **إشراف وقيادة:** الأستاذ القانوني والخبير التقني / **ياسر الرشيدي** (الرئيس التنفيذي).
            - 🌐 **الشركات التابعة المشمولة:**
              1. **شركة مصنع الشرق والغرب للصناعة** (خطوط الإنتاج، العتاد الصناعي، منظومة LK-W).
              2. **شركة رفيق السند لتجارة الجملة والتجزئة** (المستودعات المركزية وسلاسل التوريد).
              3. **شركة قمة الدرع للحلويات والمكسرات** (الضيافة الفندقية والإنتاج الغذائي الفاخر).
              4. **الإدارة العامة وحوكمة المجموعة** (الاستثمار وإدارة المنظومات).
            - 🔑 **بوابات الدخول الذكية:**
              - بوابة دخول الضيوف واستعراض الخدمات وحساب تكاليف التوريد.
              - بوابات تسجيل دخول الكوادر والموظفين حسب الشركة التابعة.
              - بوابات العملاء وتقديم طلبات عروض الأسعار (RFQ) وعقود التوريد.
              - بوابة القيادة السيادية والتنفيذية.
            
            📲 **ملف التثبيت:** قم بتحميل وتثبيت ملف `app-debug.apk` المرفق أدناه مباشرة على هاتفك الأندرويد.
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
